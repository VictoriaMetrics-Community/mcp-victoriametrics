  description: AI-powered code editor with MCP support
  docs: https://docs.cursor.com/context/model-context-protocol
  local:
    - text: "Go to: `Settings` -> `Cursor Settings` -> `MCP` -> `Add new global MCP server` and paste the following configuration into your Cursor `~/.cursor/mcp.json` file:"
      lang: json
      code: |
        {
          "mcpServers": {
            "victoriametrics": {
              "command": "/path/to/mcp-victoriametrics",
              "env": {
                "VM_INSTANCE_ENTRYPOINT": "<YOUR_VM_INSTANCE>",
                "VM_INSTANCE_TYPE": "<YOUR_VM_INSTANCE_TYPE>",
                "VM_INSTANCE_BEARER_TOKEN": "<YOUR_VM_BEARER_TOKEN>",
                "VM_INSTANCE_HEADERS": "<HEADER>=<HEADER_VALUE>,<HEADER>=<HEADER_VALUE>"
              }
            }
          }
        }
  remote:
    lang: json
    code: |
      {
        "mcpServers": {
          "victoriametrics": {
            "url": "{{url}}/mcp"
          }
        }
      }

- id: codex
  title: Codex
  description: OpenAI's open-source coding agent CLI
  docs: https://developers.openai.com/codex/mcp
  local:
    - text: |-
        Codex CLI and the IDE extension use the same MCP configuration file: `~/.codex/config.toml`
        (or `.codex/config.toml` in a trusted project).

        Run the command:
      lang: sh
      code: |
        codex mcp add victoriametrics \
          --env VM_INSTANCE_ENTRYPOINT=<YOUR_VM_INSTANCE> \
          --env VM_INSTANCE_TYPE=<YOUR_VM_INSTANCE_TYPE> \
          --env VM_INSTANCE_BEARER_TOKEN=<YOUR_VM_BEARER_TOKEN> \
          --env VM_INSTANCE_HEADERS="<HEADER>=<HEADER_VALUE>,<HEADER>=<HEADER_VALUE>" \
          -- /path/to/mcp-victoriametrics
    - text: "Or add the following to your Codex `~/.codex/config.toml` file:"
      lang: toml
      code: |
        [mcp_servers.victoriametrics]
        command = "/path/to/mcp-victoriametrics"

        [mcp_servers.victoriametrics.env]
        VM_INSTANCE_ENTRYPOINT = "<YOUR_VM_INSTANCE>"
        VM_INSTANCE_TYPE = "<YOUR_VM_INSTANCE_TYPE>"
        VM_INSTANCE_BEARER_TOKEN = "<YOUR_VM_BEARER_TOKEN>"
        VM_INSTANCE_HEADERS = "<HEADER>=<HEADER_VALUE>,<HEADER>=<HEADER_VALUE>"
  remote:
    lang: sh
    code: |
      codex mcp add victoriametrics --url {{url}}/mcp

- id: vscode
  title: Visual Studio Code
  description: Add to .vscode/mcp.json in your workspace
  docs: https://code.visualstudio.com/docs/copilot/chat/mcp-servers
  local:
    - text: "Add this to your VS Code MCP config file:"
      lang: json
      code: |
        {
          "servers": {
            "victoriametrics": {
              "type": "stdio",
              "command": "/path/to/mcp-victoriametrics",
              "env": {
                "VM_INSTANCE_ENTRYPOINT": "<YOUR_VM_INSTANCE>",
                "VM_INSTANCE_TYPE": "<YOUR_VM_INSTANCE_TYPE>",
                "VM_INSTANCE_BEARER_TOKEN": "<YOUR_VM_BEARER_TOKEN>",
                "VM_INSTANCE_HEADERS": "<HEADER>=<HEADER_VALUE>,<HEADER>=<HEADER_VALUE>"
              }
            }
          }
        }
  remote:
    lang: json
    code: |
      {
        "servers": {
          "victoriametrics": {
            "type": "http",
            "url": "{{url}}/mcp"
          }
        }
      }

