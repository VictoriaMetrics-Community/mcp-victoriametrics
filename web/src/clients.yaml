# Setup instructions for MCP clients.
# Source for the "Setup in clients" section of README.md and for the client configs page of the web UI.
# After editing run `make update-readme` and commit the generated files.
#
# local  - running the server binary over stdio (README only)
# remote - connecting to a server running in Streamable HTTP mode, {{url}} is the server base URL

- id: claude-desktop
  title: Claude Desktop
  description: Official Claude desktop app by Anthropic
  badge: Recommended
  docs: https://modelcontextprotocol.io/quickstart/user
  local:
    - text: "Add this to your Claude Desktop `claude_desktop_config.json` file (you can find it if open `Settings` -> `Developer` -> `Edit config`):"
      lang: json
      code: |
        {
          "mcpServers": {
            "victoriametrics": {
              "command": "/path/to/mcp-victoriametrics",
              "env": {
                "VM_INSTANCE_ENTRYPOINT": "<YOUR_VM_INSTANCE>",
                "VM_INSTANCE_TYPE": "<YOUR_VM_INSTANCE_TYPE>",
                "VM_INSTANCE_BEARER_TOKEN": "<YOUR_VM_BEARER_TOKEN>",
                "VM_INSTANCE_HEADERS": "<HEADER>=<HEADER_VALUE>,<HEADER>=<HEADER_VALUE>"
              }
            }
          }
        }
  remote:
    lang: json
    code: |
      {
        "mcpServers": {
          "victoriametrics": {
            "command": "npx",
            "args": ["-y", "mcp-remote", "{{url}}/mcp"]
          }
        }
      }

- id: claude-code
  title: Claude Code
  description: Anthropic's official CLI tool for developers
  docs: https://docs.anthropic.com/en/docs/agents-and-tools/claude-code/tutorials#set-up-model-context-protocol-mcp
  local:
    - text: "Run the command:"
      lang: sh
      code: |
        claude mcp add victoriametrics \
          -e VM_INSTANCE_ENTRYPOINT=<YOUR_VM_INSTANCE> \
          -e VM_INSTANCE_TYPE=<YOUR_VM_INSTANCE_TYPE> \
          -e VM_INSTANCE_BEARER_TOKEN=<YOUR_VM_BEARER_TOKEN> \
          -e VM_INSTANCE_HEADERS="<HEADER>=<HEADER_VALUE>,<HEADER>=<HEADER_VALUE>" \
          -- /path/to/mcp-victoriametrics
  remote:
    lang: sh
    code: |
      claude mcp add victoriametrics --transport http {{url}}/mcp

- id: cursor
